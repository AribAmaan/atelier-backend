services:
  - type: web
    name: rolichat-backend
    runtime: node
    plan: free
    healthCheckPath: /api/health
    # prisma/migrations/ is committed (see 0_initial_schema/), so deploys
    # apply tracked migrations in order via `migrate deploy` rather than
    # `db push`, which would silently ignore the migration history table.
    buildCommand: "npm ci && curl -sL https://letsencrypt.org/certs/isrgrootx1.pem -o ca.pem && cat ca.pem > /usr/local/share/ca-certificates/isrgrootx1.crt && update-ca-certificates --fresh && npx prisma migrate deploy && npm run db:seed && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: DATABASE_URL
        sync: false # set this to your TiDB Cloud Serverless connection string in the Render dashboard
      - key: SESSION_SECRET
        generateValue: true
      # "Sign in with Google" — OAuth 2.0 Client ID (type "Web application")
      # from Google Cloud Console > APIs & Services > Credentials. Add both
      # https://<your-netlify-site>.netlify.app AND this backend's Render
      # URL under "Authorized JavaScript origins" on that same credential.
      # If you have a separate mobile web origin, add that too. No client
      # secret needed — this only verifies ID tokens.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Set this to your Netlify site URL(s) after the frontend is deployed,
      # comma-separated if you have more than one (prod + deploy previews +
      # mobile web origin). e.g. "https://your-site.netlify.app,https://m.your-site.netlify.app"
      - key: FRONTEND_URL
        sync: false
      # Avatar hosting (uploaded + AI-generated images). Free account at
      # backblaze.com/b2 (10GB free) — no persistent disk needed, images
      # survive restarts. Key id/app key from the Application Keys page,
      # bucket name/endpoint from the bucket's own page. Bucket can stay
      # PRIVATE — the backend proxies/streams images itself via
      # /api/images/:key (see src/routes/images.ts), so no card-on-file is
      # needed for B2's first-public-bucket verification.
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_ENDPOINT
        sync: false
      # Cloudflare follows Pollinations; DiceBear is the final avatar-only fallback.
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: IMAGE_GEN_TIMEOUT_SECONDS
        value: "45"
      - key: CLOUDFLARE_IMAGE_MODEL
        value: "@cf/black-forest-labs/flux-2-klein-4b"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: GROQ_API_KEY_4
        sync: false
      - key: GROQ_MODEL
        value: "qwen/qwen3.6-27b"
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_API_KEY_2
        sync: false
      - key: NVIDIA_API_KEY_3
        sync: false
      - key: SAMBANOVA_API_KEY
        sync: false
      - key: SAMBANOVA_API_KEY_2
        sync: false
      - key: SAMBANOVA_MODEL
        value: "Meta-Llama-3.3-70B-Instruct"
      - key: CLOUDFLARE_CHAT_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_CHAT_API_TOKEN
        sync: false
      - key: CLOUDFLARE_CHAT_MODEL
        value: "@cf/meta/llama-4-scout-17b-16e-instruct"
      - key: NODE_ENV
        value: "production"
      # Billing (Razorpay) — everything in src/routes/billing.ts 503s unless
      # this is exactly "true", regardless of whether the keys below are
      # set. Leave it "false" until you're actually ready to take payments;
      # see src/lib/payments/razorpay.ts for the full rundown.
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Optional: only needed if you configure a webhook in the Razorpay
      # dashboard (Settings → Webhooks) pointed at /api/billing/webhook.
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Engine paywall — every roleplay engine in src/lib/providers/engines.ts
      # has a minTier, but it's only checked when this is exactly "true".
      # Leave "false" (or unset) to keep every engine open to every user,
      # same as before tiering existed — flip once you've got enough users
      # that upgrades matter more than growth. See resolveEngineForTier in
      # engines.ts for exactly what changes when this flips.
      - key: ENFORCE_ENGINE_TIERS
        value: "false"

